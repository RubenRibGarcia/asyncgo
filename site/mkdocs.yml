# MkDocs configuration for the asyncgo project site.
#
# Local:  make site-deps && make site-serve
# CI:     .github/workflows/docs.yml runs `make site-build`, which is
#         `mkdocs build --strict` — a broken relative link or a missing nav
#         entry fails the build instead of shipping.

site_name: asyncgo
site_description: Generate an AsyncAPI 3.1.0 specification from Go code.
# Every published version is built with its own site_url, because Material's
# version selector links a sibling as `../<version>/`: a build served from
# /asyncgo/0.1/ links to /asyncgo/0.2/, while a build served from /asyncgo/
# would link to /0.2/ and miss. site/hooks/versioning.py sets this (and the
# edit link below, which has to point at the tag the pages came from); the
# values here are what `make site-serve` uses.
site_url: https://rubenribgarcia.github.io/asyncgo/
repo_url: https://github.com/RubenRibGarcia/asyncgo
repo_name: RubenRibGarcia/asyncgo
# docs_dir is site/content, so the default (bare `content/`) would be wrong.
edit_uri: edit/master/site/content/
copyright: asyncgo is MIT licensed.

docs_dir: content
site_dir: build

theme:
  name: material
  # The versioned builds need one template override: Material ships the version
  # selector and the outdated banner itself, and the banner's text is ours.
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Concepts: concepts.md
      - Schema derivation: schema.md
      - Custom types: custom-types.md
      - Protocol bindings: bindings.md
      - Features: features.md
  - CLI: cli.md
  - Reference:
      - API index: reference/index.md
      - Struct tags: reference/struct-tags.md
  - Project:
      - Overview: project/index.md
      # Generated at build time from the repository's GitHub Releases by
      # hooks/changelog.py — the release bodies are the only copy of an entry.
      - Changelog: changelog.md
      - AsyncAPI 3.1.0 coverage: project/asyncapi-3.1.0-coverage.md
      # The two entries below are placeholders: hooks/assemble.py copies the
      # ADRs, design docs and coverage matrix out of docs/ and replaces each
      # with one nav entry per file, so adding a record needs no edit here.
      - ADRs: project/adr/README.md
      - Design docs: project/designdoc/README.md

hooks:
  - hooks/versioning.py
  - hooks/assemble.py
  - hooks/changelog.py

# Rebuild when the development-process records change (watch paths are relative
# to this file).
watch:
  - ../docs
  - hooks/changelog.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

# Mermaid diagrams are deliberately not enabled yet: the fence needs a
# `!!python/name:pymdownx.superfences.fence_code_format` formatter, and a strict
# YAML linter reports that tag as unresolved (it is valid MkDocs configuration,
# not portable YAML). Re-enable it when the first diagram lands, as:
#
#   - pymdownx.superfences:
#       custom_fences:
#         - name: mermaid
#           class: mermaid
#           format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  # Enables Material's version selector. It fetches ../versions.json, which
  # site/scripts/build_site.py writes beside the version directories, and it
  # treats a page as outdated unless its version (or one of its aliases)
  # matches this pattern — `dev` is the current checkout, not an old release,
  # so it must not be warned about. `provider: mike` is Material's documented
  # key for the schema of versions.json; the mike plugin itself is not used,
  # because it would mean publishing from a branch instead of the Pages
  # artifact.
  version:
    provider: mike
    default: "latest|dev"
  # Filled in per build by site/hooks/versioning.py; empty for a plain local
  # build, which leaves the banner text blank rather than lying about a version.
  current_version: ""
  current_tag: ""
  latest_version: ""
  latest_url: https://rubenribgarcia.github.io/asyncgo/latest/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RubenRibGarcia/asyncgo
      name: asyncgo on GitHub
    - icon: material/language-go
      link: https://pkg.go.dev/github.com/RubenRibGarcia/asyncgo
      name: asyncgo on pkg.go.dev
