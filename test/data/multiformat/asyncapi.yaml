asyncapi: 3.1.0
info:
  title: Multi Format Orders Service
  version: 1.0.0
  description: Order events carried in OpenAPI, RAML, and Protobuf schema formats
channels:
  order-openapi:
    address: order-openapi
    messages:
      OrderPlaced:
        payload:
          schemaFormat: application/vnd.oai.openapi;version=3.0.0
          schema:
            properties:
              amount:
                format: double
                type: number
              orderId:
                format: uuid
                type: string
            required:
            - orderId
            type: object
        name: OrderPlaced
    description: Order placements described by an OpenAPI 3.0.0 schema
  order-protobuf:
    address: order-protobuf
    messages:
      OrderCancelled:
        payload:
          schemaFormat: application/vnd.google.protobuf;version=3
          schema: message OrderCancelled { string order_id = 1; }
        name: OrderCancelled
    description: Order cancellations described by a Protobuf message
  order-raml:
    address: order-raml
    messages:
      OrderShipped:
        payload:
          schemaFormat: application/raml+yaml;version=1.0
          schema:
            properties:
              carrier:
                type: string
              orderId:
                type: string
            required:
            - orderId
            type: object
        name: OrderShipped
    description: Order shipments described by a RAML 1.0 data type
operations:
  order-openapi.send:
    action: send
    channel:
      $ref: "#/channels/order-openapi"
    messages:
    - $ref: "#/channels/order-openapi/messages/OrderPlaced"
  order-protobuf.send:
    action: send
    channel:
      $ref: "#/channels/order-protobuf"
    messages:
    - $ref: "#/channels/order-protobuf/messages/OrderCancelled"
  order-raml.send:
    action: send
    channel:
      $ref: "#/channels/order-raml"
    messages:
    - $ref: "#/channels/order-raml/messages/OrderShipped"
