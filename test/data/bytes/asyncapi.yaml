asyncapi: 3.1.0
info:
  title: Binary Payloads
  version: 1.0.0
  description: A payload whose byte slices derive to base64-encoded strings
channels:
  attachment-uploaded:
    address: attachment-uploaded
    messages:
      github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment:
        $ref: "#/components/messages/github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment"
    description: Emitted when an attachment is uploaded
operations:
  attachment-uploaded.send:
    action: send
    channel:
      $ref: "#/channels/attachment-uploaded"
    messages:
    - $ref: "#/channels/attachment-uploaded/messages/github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment"
components:
  schemas:
    github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment:
      type: object
      properties:
        body:
          description: Body is the raw file content, derived as base64.
          oneOf:
          - type: string
            format: byte
            contentEncoding: base64
          - type: "null"
        name:
          type: string
          description: Name is the attachment's file name.
        thumbnail:
          description: Thumbnail is a preview image, whose media type the Go type cannot carry.
          oneOf:
          - type: string
            format: byte
            contentEncoding: base64
            contentMediaType: image/png
          - type: "null"
      required:
      - name
      - body
  messages:
    github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment:
      payload:
        $ref: "#/components/schemas/github.com_RubenRibGarcia_asyncgo_test_data_bytes.Attachment"
      name: Attachment
