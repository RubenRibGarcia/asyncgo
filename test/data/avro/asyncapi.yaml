asyncapi: 3.1.0
info:
  title: Avro Orders Service
  version: 1.0.0
  description: Order events whose payloads are Avro records
channels:
  order-cancelled:
    address: order-cancelled
    messages:
      OrderCancelled:
        payload:
          schemaFormat: application/vnd.apache.avro;version=1.9.0
          schema:
            fields:
            - name: orderId
              type: string
            name: OrderCancelled
            type: record
        name: OrderCancelled
    description: Order cancellations
  order-placed:
    address: order-placed
    messages:
      OrderPlaced:
        headers:
          schemaFormat: application/vnd.apache.avro;version=1.9.0
          schema:
            fields:
            - name: correlationId
              type: string
            name: OrderHeaders
            type: record
        payload:
          $ref: "#/components/schemas/UserAvro"
        name: OrderPlaced
    description: Order placements
  order-shipped:
    address: order-shipped
    messages:
      OrderShipped:
        payload:
          $ref: "#/components/schemas/UserAvro"
        name: OrderShipped
    description: Order shipments
operations:
  order-cancelled.send:
    action: send
    channel:
      $ref: "#/channels/order-cancelled"
    messages:
    - $ref: "#/channels/order-cancelled/messages/OrderCancelled"
  order-placed.send:
    action: send
    channel:
      $ref: "#/channels/order-placed"
    messages:
    - $ref: "#/channels/order-placed/messages/OrderPlaced"
  order-shipped.send:
    action: send
    channel:
      $ref: "#/channels/order-shipped"
    messages:
    - $ref: "#/channels/order-shipped/messages/OrderShipped"
components:
  schemas:
    UserAvro:
      schemaFormat: application/vnd.apache.avro;version=1.9.0
      schema:
        fields:
        - name: displayName
          type: string
        - name: age
          type: int
        name: User
        type: record
