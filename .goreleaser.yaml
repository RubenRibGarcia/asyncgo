version: 2

project_name: asyncgo

builds:
    - id: asyncgo
      main: ./cmd/asyncgo
      binary: asyncgo
      env:
          - CGO_ENABLED=0
      goos:
          - linux
          - darwin
          - windows
      goarch:
          - amd64
          - arm64
      ldflags:
          - -s -w
          - -X main.version={{.Tag}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}

sboms:
    - id: archive
      artifacts: archive

archives:
    - formats: ["tar.gz"]
      wrap_in_directory: true
      format_overrides:
          - goos: windows
            formats: ["zip"]
      name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
      files:
          - LICENSE
          - README.md

snapshot:
    version_template: SNAPSHOT-{{ .Commit }}

checksum:
    disable: false
    name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

changelog:
    sort: asc
    filters:
        exclude:
            - "(?i)^docs?:"
            - '(?i)^docs\([^:]+\):'
            - '(?i)^docs\[[^:]+\]:'
            - "^tests?:"
            - "(?i)^dev:"
            - "(?i)^chore:"
            - '^build\(deps\): bump .* in /docs \(#\d+\)'
            - '^build\(deps\): bump .* in /\.github/peril \(#\d+\)'
            - '^build\(deps\): bump .* in /scripts/gen_github_action_config \(#\d+\)'
            - Merge pull request
            - Merge branch

release:
    skip_upload: false
    github:
        owner: RubenRibGarcia
        name: asyncgo
    mode: keep-existing

source:
    enabled: true
    name_template: "{{ .ProjectName }}-{{ .Version }}-source"
