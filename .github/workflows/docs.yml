name: Docs

# Builds the MkDocs site in site/ with --strict and publishes it to GitHub
# Pages. Pull requests build but never deploy, so a broken link or a missing nav
# entry fails review instead of shipping.
#
# One-time repository setup: Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - site/**
      - docs/**
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [master]
    paths:
      - site/**
      - docs/**
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This workflow only reads the repository and then uploads a Pages
          # artifact from site/build; keeping the token out of .git/config means
          # it cannot be swept into that artifact.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install site dependencies
        run: pip install -r site/requirements.txt

      # --strict turns MkDocs warnings (broken relative links, pages missing
      # from nav, unknown anchors) into build failures. The token raises the
      # GitHub API rate limit for hooks/changelog.py, which renders the release
      # notes; a build without it still works and falls back to its cache.
      - name: Build site
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
