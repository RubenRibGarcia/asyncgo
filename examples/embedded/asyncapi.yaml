asyncapi: 3.1.0
info:
  title: Orders Service
  version: 1.0.0
  description: Order lifecycle events
  contact:
    name: Orders Team
    email: orders@example.com
servers:
  prod:
    host: broker.example.com:9092
    protocol: kafka
    description: Production Kafka cluster
defaultContentType: application/json
channels:
  order-event:
    address: order-event
    messages:
      OrderEvent:
        payload:
          $ref: "#/components/schemas/github.com~1RubenRibGarcia~1asyncgo~1examples~1embedded.OrderEvent"
        name: OrderEvent
    description: Envelope carrying a union of order event types
    bindings:
      kafka:
        partitions: 3
        topic: order-events
  order-placed:
    address: order-placed
    messages:
      OrderPlaced:
        payload:
          $ref: "#/components/schemas/github.com~1RubenRibGarcia~1asyncgo~1examples~1embedded.OrderPlaced"
        name: OrderPlaced
    description: Emitted when an order is placed
    bindings:
      kafka:
        partitions: 3
        topic: order-placed
operations:
  order-event.send:
    action: send
    channel:
      $ref: "#/channels/order-event"
    messages:
    - $ref: "#/channels/order-event/messages/OrderEvent"
  order-placed.send:
    action: send
    channel:
      $ref: "#/channels/order-placed"
    messages:
    - $ref: "#/channels/order-placed/messages/OrderPlaced"
components:
  schemas:
    github.com/RubenRibGarcia/asyncgo/examples/embedded.BaseSchema:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the order
      required:
      - id
    github.com/RubenRibGarcia/asyncgo/examples/embedded.OrderCancelled:
      type: object
      properties:
        order_id:
          type: string
        reason:
          type: string
          description: Reason for the cancellation
      required:
      - order_id
    github.com/RubenRibGarcia/asyncgo/examples/embedded.OrderEvent:
      type: object
      properties:
        data:
          oneOf:
          - $ref: "#/components/schemas/github.com~1RubenRibGarcia~1asyncgo~1examples~1embedded.OrderPlaced"
          - $ref: "#/components/schemas/github.com~1RubenRibGarcia~1asyncgo~1examples~1embedded.OrderCancelled"
      required:
      - data
    github.com/RubenRibGarcia/asyncgo/examples/embedded.OrderPlaced:
      type: object
      allOf:
      - $ref: "#/components/schemas/github.com~1RubenRibGarcia~1asyncgo~1examples~1embedded.BaseSchema"
      - type: object
        properties:
          amount:
            type: number
            format: double
          note:
            type: string
            description: Optional note from the customer
        required:
        - amount
