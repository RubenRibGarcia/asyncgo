asyncapi: 3.1.0
info:
  title: Orders Service
  version: 1.0.0
  description: Order lifecycle events
  contact:
    name: Orders Team
    email: orders@example.com
  license:
    name: MIT
servers:
  prod:
    host: broker.example.com:9092
    protocol: kafka
    description: Production Kafka cluster
defaultContentType: application/json
channels:
  order-cancelled:
    address: order-cancelled
    description: Emitted when an order is cancelled
  order-placed:
    address: order-placed
    messages:
      OrderPlaced:
        payload:
          $ref: "#/components/schemas/example.com~1orders~1orders.OrderPlaced"
        name: OrderPlaced
    description: Emitted when an order is placed
    bindings:
      kafka:
        partitions: 3
        topic: order-placed
operations:
  order-placed.send:
    action: send
    channel:
      $ref: "#/channels/order-placed"
    messages:
    - $ref: "#/channels/order-placed/messages/OrderPlaced"
components:
  schemas:
    example.com/orders/orders.OrderPlaced:
      type: object
      properties:
        amount:
          type: number
          format: double
        note:
          type: string
          description: Optional note from the customer
        order_id:
          type: string
      required:
      - order_id
      - amount
